{% extends "base.html" %}

{% block title %}Analytics — MediTrack{% endblock %}

{% block content %}
<div class="auth-section">
    <div class="auth-container">
        <div class="auth-card analytics-coming-soon">
            <div class="analytics-visual">
                <div class="analytics-icon-box">
                    <i data-lucide="clock"></i>
                </div>
                <div class="analytics-badge">Coming Soon</div>
            </div>

            <h1 class="auth-title">Advanced Analytics</h1>
            <p class="auth-subtitle">
                We&rsquo;re working on powerful insights and visualizations to help you understand your health patterns better.
            </p>

            <div class="analytics-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <p class="analytics-footer">We&rsquo;re crafting something special</p>
        </div>
    </div>
</div>

<style>
    .analytics-coming-soon {
        text-align: center;
        padding: 3rem 2rem;
    }

    .analytics-visual {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        margin-bottom: 2.5rem;
    }

    .analytics-icon-box {
        background: var(--accent);
        color: var(--paper);
        width: 80px;
        height: 80px;
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .analytics-icon-box i {
        width: 32px;
        height: 32px;
    }

    .analytics-badge {
        background: var(--accent);
        color: var(--paper);
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.5rem 1.25rem;
        border-radius: 999px;
    }

    .analytics-dots {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        margin: 2rem 0 1rem;
    }

    .analytics-dots span {
        width: 8px;
        height: 8px;
        background: var(--border);
        border-radius: 50%;
    }

    .analytics-footer {
        font-size: 0.85rem;
        color: var(--ink-muted);
        font-style: italic;
    }
</style>
{% endblock %}
