{% extends "base.html" %}

{% block title %}Add Health Log - MediTrack{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-section legal-card">
        <h2 class="auth-title">Add Health Log</h2>
        <p class="auth-subtitle">Record a new health event in your journal.</p>

        <form action="{{ url_for('add_log') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="entry_type">Entry Type</label>
                <select name="entry_type" id="entry_type" required>
                    <option value="health_log">Health Log</option>
                    <option value="vitals">Vitals</option>
                </select>
            </div>

            <div class="form-group">
                <label for="symptom">Name/Metric</label>
                <select name="symptom" id="symptom" required>
                    <option value="" disabled selected>Select an option...</option>
                    <optgroup label="Health Logs">
                        <option value="Headache">Headache</option>
                        <option value="Fatigue">Fatigue</option>
                        <option value="Nausea">Nausea</option>
                        <option value="Fever">Fever</option>
                        <option value="Cough">Cough</option>
                        <option value="Sore Throat">Sore Throat</option>
                        <option value="Muscle Pain">Muscle Pain</option>
                        <option value="Other">Other</option>
                    </optgroup>
                    <optgroup label="Vitals">
                        <option value="sleep_hours">Sleep Hours</option>
                        <option value="resting_hr">Resting HR</option>
                        <option value="weight_kg">Weight (kg)</option>
                        <option value="blood_pressure_systolic">BP Systolic</option>
                        <option value="blood_pressure_diastolic">BP Diastolic</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label for="severity">Severity (1-10)</label>
                <input type="number" name="severity" id="severity" min="1" max="10" placeholder="1 = Mild, 10 = Severe">
            </div>

            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea name="notes" id="notes" placeholder="Additional details..."></textarea>
            </div>

            <div class="form-group">
                <label for="logged_at">Date</label>
                <input type="date" name="logged_at" id="logged_at" required value="{{ date.today().strftime('%Y-%m-%d') if date else '' }}">
            </div>

            <button type="submit" class="btn-submit">Save Entry</button>
        </form>
    </div>
</div>
{% endblock %}
