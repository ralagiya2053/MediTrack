{% extends "base.html" %}

{% block title %}Edit Vital - MediTrack{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-section legal-card">
        <h2 class="auth-title">Edit Vital Reading</h2>
        <p class="auth-subtitle">Modify a recorded vital reading in your journal.</p>

        <form action="{{ url_for('edit_vital', id=vital.id) }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="metric">Metric</label>
                <select name="metric" id="metric" required>
                    <option value="sleep_hours" {% if vital.metric == 'sleep_hours' %}selected{% endif %}>Sleep Hours</option>
                    <option value="resting_hr" {% if vital.metric == 'resting_hr' %}selected{% endif %}>Resting HR</option>
                    <option value="weight_kg" {% if vital.metric == 'weight_kg' %}selected{% endif %}>Weight (kg)</option>
                    <option value="blood_pressure_systolic" {% if vital.metric == 'blood_pressure_systolic' %}selected{% endif %}>BP Systolic</option>
                    <option value="blood_pressure_diastolic" {% if vital.metric == 'blood_pressure_diastolic' %}selected{% endif %}>BP Diastolic</option>
                </select>
            </div>

            <div class="form-group">
                <label for="value">Value</label>
                <input type="number" step="0.1" name="value" id="value" required value="{{ vital.value }}">
            </div>

            <div class="form-group">
                <label for="logged_at">Date</label>
                <input type="date" name="logged_at" id="logged_at" required value="{{ vital.logged_at }}">
            </div>

            <button type="submit" class="btn-submit">Update Reading</button>
        </form>
    </div>
</div>
{% endblock %}
